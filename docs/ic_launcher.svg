  <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f5d879"/><stop offset="1" stop-color="#cf7b20"/></linearGradient>
  <linearGradient id="side" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d79a3c"/><stop offset="1" stop-color="#a85d1d"/></linearGradient>
  <mask id="rayMask">
    <rect width="512" height="512" fill="white"/>
     <polygon points="256,95 170,260 342,260" fill="black"/>
